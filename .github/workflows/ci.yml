# Checks the compiled brain on every push and pull request, through its public interface only (brain/include/aa.h).
# Nothing here builds or changes the brain: each job links the libraries in brain/lib as they are. The check program
# in .github/ci prints one line per answer, and every target must print the very lines in .github/ci/expected.txt:
# the README's example, 14 problems of the earlier 300-problem challenge (every kind of answer), the online learner and
# the documented error codes, bit for bit.
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * 1"        # weekly

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  COMPARED: '^(version|readme|p[0-9]{3}|stream|errors) '

jobs:
  checksums:
    name: Checksums of the published libraries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sha256sum -c SHA256SUMS.txt

  native:
    name: Native (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x86_64
            os: ubuntu-latest
          - target: linux-aarch64
            os: ubuntu-24.04-arm
          - target: macos-arm64
            os: macos-latest
    runs-on: ${{ matrix.os }}
    env:
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@v4

      - name: The README's example compiles and runs as published
        run: |
          awk '/^```c$/ {f = 1; next} /^```$/ {f = 0} f' README.md > your.c
          cc -std=c11 -I brain/include your.c brain/lib/$TARGET/libaa.a -o your_program
          ./your_program

      - name: Every line the same as the reference; the stack within its promise
        run: |
          cc -std=c11 -O2 -ffp-contract=off -Wall -Wextra -Ibrain/include .github/ci/check.c .github/ci/host.c \
            brain/lib/$TARGET/libaa.a -lpthread -o check
          ./check | tee check.txt
          diff <(grep -E "$COMPARED" .github/ci/expected.txt) <(grep -E "$COMPARED" check.txt)
          echo "every line the same as the reference: $(grep -cE "$COMPARED" check.txt) of $(grep -cE "$COMPARED" .github/ci/expected.txt)"

      - name: No heap and no global data in the library
        run: |
          data=$(nm brain/lib/$TARGET/libaa.a | awk 'NF >= 3 && $2 ~ /^[DdBbCc]$/' | wc -l)
          echo "data or bss symbols in the library: $data"
          test "$data" -eq 0
          if nm -u brain/lib/$TARGET/libaa.a | grep -E '(^|[ _])(malloc|calloc|realloc|free)$'; then
            echo "the library calls the heap"; exit 1
          fi

      - name: The header compiles cleanly in C99, C11 and C++
        run: |
          printf '#include "aa.h"\nint main(void) { return aa_version() == (uint32_t)AA_VERSION ? 0 : 1; }\n' > header.c
          for std in c99 c11; do
            cc -std=$std -Wall -Wextra -Wpedantic -Werror -Ibrain/include header.c brain/lib/$TARGET/libaa.a -o header
            ./header
          done
          c++ -std=c++11 -Wall -Wextra -Wpedantic -Werror -Ibrain/include -x c++ header.c -x none \
            brain/lib/$TARGET/libaa.a -o header
          ./header

      - name: The space program builds and answers
        working-directory: space
        run: |
          make nasa_run TARGET=$TARGET
          printf '%s\n' 'w1 R 8 55 68 19 29 95 4 92 13 440 544 152 232 760 32 736 104 2 111 118' \
                        'w2 S 8 1 3 0 0 -3 -9 -12 -36' | ./nasa_run | tee out.txt
          grep -q '^w1 by=AM ans=888,944 ' out.txt
          grep -q '^w2 by=AM ans=-39,-117 ' out.txt

  cortex-m:
    name: Emulated ${{ matrix.core }} (QEMU)
    strategy:
      fail-fast: false
      matrix:
        include:
          - core: cortex-m4f
            flags: -mcpu=cortex-m4 -mfpu=fpv4-sp-d16 -mfloat-abi=hard
            ld: mps2.ld
            board: mps2-an386
          - core: cortex-m7
            flags: -mcpu=cortex-m7 -mfpu=fpv5-d16 -mfloat-abi=hard
            ld: mps2.ld
            board: mps2-an500
          - core: cortex-m33
            flags: -mcpu=cortex-m33 -mfpu=fpv5-sp-d16 -mfloat-abi=hard
            ld: an505.ld
            board: mps2-an505
          - core: cortex-m0plus     # on QEMU's Cortex-M0 board: the same instructions (ARMv6-M), no floating-point unit
            flags: -mcpu=cortex-m0
            ld: microbit.ld
            board: microbit
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install the GNU Arm toolchain and QEMU
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q gcc-arm-none-eabi libnewlib-arm-none-eabi qemu-system-arm

      - name: No global data in the ${{ matrix.core }} library
        run: |
          data=$(arm-none-eabi-nm brain/lib/${{ matrix.core }}/libaa.a | awk 'NF >= 3 && $2 ~ /^[DdBbCc]$/' | wc -l)
          echo "data or bss symbols in the library: $data"
          test "$data" -eq 0

      - name: Build the check with the ${{ matrix.core }} library
        run: |
          arm-none-eabi-gcc ${{ matrix.flags }} -mthumb -std=c11 -O2 -ffp-contract=off -ffreestanding -nostartfiles \
            -Wall -Wextra -Wl,--gc-sections -Wl,--no-enum-size-warning -Ibrain/include -T .github/ci/${{ matrix.ld }} \
            .github/ci/check.c .github/ci/bare.c .github/ci/startup_cortex_m.c \
            brain/lib/${{ matrix.core }}/libaa.a -lc -lgcc -o check.elf
          arm-none-eabi-size check.elf

      - name: Run it in QEMU, every line the same as the reference; the stack within its promise
        run: |
          timeout 40m qemu-system-arm -M ${{ matrix.board }} -nographic -monitor none -serial none \
            -semihosting-config enable=on,target=native -kernel check.elf > chip.log 2>&1 || true
          cat chip.log
          diff <(grep -E "$COMPARED" .github/ci/expected.txt) <(grep -E "$COMPARED" chip.log)
          grep -q '^STACK .* within the promise' chip.log
          grep -q '^DONE$' chip.log
          echo "every line the same as the reference: $(grep -cE "$COMPARED" chip.log) of $(grep -cE "$COMPARED" .github/ci/expected.txt)"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qemu-${{ matrix.core }}-log
          path: chip.log
